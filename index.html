<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Björn Eberhardt – Leben. Verstehen. Wachsen.</title>
    <meta name="description"
        content="Mentor, IT-Consultant und unabhängiger Finanzstratege aus Hamburg. Ich öffne die Tür – hindurchgehen musst Du selbst.">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- LLM Content discovery -->
    <link rel="alternate" type="text/plain" title="LLM-friendly Content" href="llms.txt">
</head>

<body>
    <a class="llm-link" href="llms.txt">LLM / Agent Interface</a>

    <div class="container">

        <!-- Admin Bar (visible only when logged in) -->
        <div id="adminBar" class="admin-navbar">
            <div class="admin-info">
                <i class="fa-solid fa-user-shield"></i> <span class="admin-info-text">Admin-Modus Aktiv</span>
            </div>
            <div class="admin-actions">
                <button class="btn-admin btn-admin-primary" id="addTileBtn" title="Kachel Hinzufügen"><i
                        class="fa-solid fa-plus"></i> <span class="btn-text">Kachel Hinzufügen</span></button>
                <button class="btn-admin" id="editSettingsBtn" title="Einstellungen"><i class="fa-solid fa-gear"></i>
                    <span class="btn-text">Einstellungen</span></button>
                <button class="btn-admin" id="refreshVectorsBtn" title="Vektoren Neu Generieren"><i
                        class="fa-solid fa-arrows-rotate"></i> <span class="btn-text">Vektoren Neu
                        Generieren</span></button>
                <button class="btn-admin" id="logoutBtn" title="Abmelden"><i class="fa-solid fa-right-from-bracket"></i>
                    <span class="btn-text">Abmelden</span></button>
            </div>
        </div>

        <!-- Search Header -->
        <header class="search-header" style="position: relative;">
            <div class="header-controls"
                style="position: absolute; top: 0; right: 0; display: flex; gap: 0.5rem; z-index: 10; align-items: center;">
                <!-- Language Dropdown -->
                <div class="dropdown lang-dropdown" id="langDropdown">
                    <button class="dropdown-trigger suggestion-pill" id="langTriggerBtn"
                        title="Sprache wechseln / Change language">
                        <i class="fa-solid fa-globe"></i> <span class="current-lang" id="currentLangText">DE</span>
                    </button>
                    <div class="dropdown-menu" id="langDropdownMenu">
                        <button class="dropdown-item" data-lang="de">Deutsch</button>
                        <button class="dropdown-item" data-lang="en">English</button>
                    </div>
                </div>
                <!-- Theme Toggle -->
                <button id="themeToggleBtn" class="suggestion-pill"
                    style="border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; padding: 0; margin: 0; position: static;"
                    title="Farbschema umschalten"><i class="fa-solid fa-moon"></i></button>
            </div>
            <h1 class="main-title" id="heroTitle">Björn Eberhardt</h1>
            <p class="text-muted" style="margin-top:-0.5rem; font-weight: 500;" id="heroTagline">Leben. Verstehen.
                Wachsen.</p>

            <div class="search-container">
                <input type="text" id="searchInput" class="search-input"
                    placeholder="Suche nach Themen (z.B. IT, Finanzen, Parkour, Bio)..." autocomplete="off">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
            </div>

            <!-- Fake tiles/Pills suggesting search terms on load -->
            <div class="category-suggestions" id="categorySuggestions">
                <span class="suggestion-pill" data-search="IT"># IT-Consulting</span>
                <span class="suggestion-pill" data-search="Finanzen"># Finanzen</span>
                <span class="suggestion-pill" data-search="Sports"># Parkour</span>
                <span class="suggestion-pill" data-search="vcard"># vCard & Kontakt</span>
            </div>
        </header>

        <!-- Main Tiles Grid -->
        <main class="tiles-grid" id="tilesGrid">
            <!-- Tiles will be dynamically injected here by app.js -->
        </main>

        <!-- Spinner loader for infinite scroll -->
        <div class="loading-trigger" id="loadingTrigger">
            <div class="spinner" id="loadingSpinner"></div>
        </div>

        <!-- Secret Footer Area for admin mode trigger -->
        <footer class="secret-trigger" id="secretTrigger">
            &copy; 2026 Björn Eberhardt. <span style="cursor: pointer;" id="adminTrigger">Admin</span>
        </footer>

    </div>

    <!-- 1. DETAILS LIGHTBOX MODAL -->
    <dialog id="detailsDialog">
        <div class="dialog-container">
            <div class="dialog-header-bar">
                <div class="dialog-header-title" id="detailsDialogHeader">Details</div>
                <button class="close-btn" id="closeDetailsBtn">&times;</button>
            </div>
            <div class="dialog-body" id="detailsDialogBody">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </dialog>



    <!-- Frontend Script -->
    <script src="app.js"></script>
</body>

</html>
