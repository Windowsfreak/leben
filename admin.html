<!-- 1. ADMIN NAVBAR BAR -->
<div id="adminBar" class="admin-navbar">
    <div class="admin-info">
        <i class="fa-solid fa-user-shield"></i> <span class="admin-info-text">Admin-Modus Aktiv</span>
    </div>
    <div class="admin-actions">
        <button class="btn-admin btn-admin-primary" id="addTileBtn" title="Kachel Hinzufügen"><i
                class="fa-solid fa-plus"></i> <span class="btn-text">Kachel Hinzufügen</span></button>
        <button class="btn-admin" id="editSettingsBtn" title="Einstellungen"><i class="fa-solid fa-gear"></i>
            <span class="btn-text">Einstellungen</span></button>
        <button class="btn-admin" id="refreshVectorsBtn" title="Vektoren Neu Generieren"><i
                class="fa-solid fa-arrows-rotate"></i> <span class="btn-text">Vektoren Neu
                Generieren</span></button>
        <button class="btn-admin" id="logoutBtn" title="Abmelden"><i class="fa-solid fa-right-from-bracket"></i>
            <span class="btn-text">Abmelden</span></button>
    </div>
</div>

<!-- 2. ADMIN LOGIN MODAL -->
<dialog id="loginDialog">
    <div class="dialog-container">
        <div class="dialog-header-bar">
            <div class="dialog-header-title">Admin Login</div>
            <button class="close-btn" id="closeLoginBtn">&times;</button>
        </div>
        <div class="dialog-body">
            <form id="loginForm" onsubmit="return false;">
                <div class="admin-form-group">
                    <label for="adminPassword">Passwort eingeben</label>
                    <input type="password" id="adminPassword" class="admin-form-control" placeholder="••••••••"
                        required>
                </div>
                <div class="mt-4" style="display:flex; gap:1rem;">
                    <button type="submit" class="btn btn-primary" id="submitLoginBtn">Anmelden</button>
                </div>
            </form>
        </div>
    </div>
</dialog>

<!-- 3. ADMIN EDITOR MODAL -->
<dialog id="editorDialog" style="max-width: 780px; width: 95%;">
    <div class="dialog-container">
        <div class="dialog-header-bar">
            <div class="dialog-header-title" id="editorDialogTitle">Kachel erstellen/bearbeiten</div>
            <button class="close-btn" id="closeEditorBtn">&times;</button>
        </div>
        <div class="dialog-body">
            <form id="editorForm" onsubmit="return false;">
                <input type="hidden" id="editId">

                <div class="form-row">
                    <div class="admin-form-group">
                        <label for="editName">Name</label>
                        <input type="text" id="editName" class="admin-form-control" required placeholder="z.B. bio">
                    </div>
                    <div class="admin-form-group">
                        <label for="editLanguage">Sprachcode</label>
                        <input type="text" id="editLanguage" class="admin-form-control" required placeholder="de">
                    </div>
                </div>

                <div class="form-row">
                    <div class="admin-form-group" style="position: relative;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <label for="editCategoryTags">Kategorien (Kommagetrennt)</label>
                            <button type="button" class="btn-magic-wand" id="suggestMetaBtn"
                                title="Metadaten (Summary & Kategorien) per KI generieren"
                                style="padding: 2px 8px; font-size: 0.8rem; background: var(--accent); color: #0b0f19; border: none; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 4px;"><i
                                    class="fa-solid fa-wand-magic-sparkles"></i> Generieren</button>
                        </div>
                        <input type="text" id="editCategoryTags" class="admin-form-control"
                            placeholder="finance,crypto,investments">
                    </div>
                    <div class="admin-form-group">
                        <label for="editAccentColor">Akzentfarbe</label>
                        <div style="display:flex; gap:0.5rem;">
                            <input type="color" id="editAccentColorPicker" class="admin-form-control"
                                style="width: 50px; padding: 2px; height: 38px;"
                                oninput="document.getElementById('editAccentColor').value = this.value">
                            <input type="text" id="editAccentColor" class="admin-form-control" placeholder="#fbbf24"
                                value="#fbbf24"
                                oninput="document.getElementById('editAccentColorPicker').value = this.value">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="admin-form-group" style="grid-column: span 2;">
                        <label for="editBackground">Hintergrund-CSS</label>
                        <div style="display:flex; gap:0.5rem;">
                            <input type="text" id="editBackground" class="admin-form-control"
                                placeholder="Standardmäßig leer. z.B. url(./tileimg/filename.webp) center/cover">
                            <button type="button" class="btn-admin btn-admin-primary" id="openImagePickerBtn"
                                title="Bild verwalten / auswählen"
                                style="border-radius: 6px; padding: 0 1rem; display: flex; align-items: center; gap: 6px; flex-shrink: 0;"><i
                                    class="fa-solid fa-image"></i> Mediathek</button>
                        </div>
                    </div>
                </div>

                <!-- HTML content & preview editor tabs located ABOVE Klick-Verhalten -->
                <div class="admin-form-group" style="position: relative;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label>Ansicht</label>
                        <button type="button" class="btn-magic-wand" id="tileLLMHelperBtn" title="KI-HTML-Assistent"
                            style="padding: 2px 8px; font-size: 0.8rem; background: var(--accent); color: #0b0f19; border: none; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 4px;"><i
                                class="fa-solid fa-wand-magic-sparkles"></i> KI-Assistent</button>
                    </div>
                    <div class="editor-tabs">
                        <button type="button" class="editor-tab active" id="tabPreviewBtn">Vorschau</button>
                        <button type="button" class="editor-tab" id="tabCodeBtn">HTML-Code</button>
                    </div>

                    <!-- Preview Content (Default active) -->
                    <div id="editorPreviewContainer" class="editor-tab-content active">
                        <div class="preview-tile-wrapper">
                            <div class="tiles-grid"
                                style="display: grid; grid-template-columns: 1fr; max-width: 360px; margin: 1rem auto;">
                                <div id="tileLivePreview" class="tile" style="pointer-events: none; margin:0;">
                                    <div class="tile-content" id="tileLivePreviewContent"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Code Editor Content -->
                    <div id="editorCodeContainer" class="editor-tab-content">
                        <div id="monacoHtmlEditor"
                            style="height: 220px; border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; margin-top: 0.5rem;">
                        </div>
                        <textarea id="editHtmlContent" class="admin-form-control"
                            style="display: none; min-height: 120px;" placeholder="HTML-Gerüst der Karte..."></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="admin-form-group">
                        <label for="editReferenceType">Klickverhalten</label>
                        <select id="editReferenceType" class="admin-form-control">
                            <option value="doc">Dokument (Doc)</option>
                            <option value="link">Link</option>
                        </select>
                    </div>
                    <div class="admin-form-group">
                        <label for="editSortOrder">Reihenfolge</label>
                        <input type="number" id="editSortOrder" class="admin-form-control" value="100">
                    </div>
                </div>

                <!-- Target Link field (shown only when type is 'link') -->
                <div class="admin-form-group" id="editorLinkFields" style="display: none;">
                    <label for="editLink">Ziel-Webseite</label>
                    <input type="text" id="editLink" class="admin-form-control" placeholder="https://...">
                </div>

                <!-- Lightbox content fields (shown only when type is 'doc') -->
                <div id="editorLightboxFields" style="display: none;">
                    <div class="form-row">
                        <div class="admin-form-group">
                            <label for="editTitle">Fenstertitel</label>
                            <input type="text" id="editTitle" class="admin-form-control" placeholder="z.B. Mein Leben">
                        </div>
                        <div class="admin-form-group">
                            <label for="editContentFile">Inhaltsdatei</label>
                            <input type="text" id="editContentFile" class="admin-form-control" placeholder="bio-de.html">
                        </div>
                    </div>
                </div>

                <div class="admin-form-group">
                    <label for="editSummary">Inhaltsangabe für KI-Suche</label>
                    <textarea id="editSummary" class="admin-form-control" required
                        placeholder="Kurze, präzise Beschreibung für die KI..."></textarea>
                </div>

                <div class="admin-form-group checkbox-row">
                    <input type="checkbox" id="editVisible" checked>
                    <label for="editVisible">Sichtbar</label>
                </div>

                <div class="mt-4" style="display:flex; gap:1rem; flex-wrap: wrap;">
                    <button type="submit" class="btn btn-primary" id="saveTileBtn"><i
                            class="fa-solid fa-floppy-disk"></i> Speichern</button>
                    <button type="button" class="btn" id="autoTranslateBtn"
                        style="background: rgba(168, 85, 247, 0.2); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.4);"
                        title="Automatisch in die 2. Sprache übersetzen (z.B. DE -> EN oder EN -> DE)"><i
                            class="fa-solid fa-language"></i> Per KI Übersetzen</button>
                    <button type="button" class="btn" id="cancelEditorBtn">Abbrechen</button>
                </div>
            </form>
        </div>
    </div>
</dialog>

<!-- 4. PAGE-WIDE SETTINGS EDITOR MODAL -->
<dialog id="settingsDialog" style="max-width: 800px; width: 95%;">
    <div class="dialog-container">
        <div class="dialog-header-bar">
            <div class="dialog-header-title">Seiteneinstellungen</div>
            <button class="close-btn" id="closeSettingsBtn">&times;</button>
        </div>
        <div class="dialog-body">
            <div id="monacoSettingsEditor"
                style="height: 380px; border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; margin-bottom: 1rem;">
            </div>
            <textarea id="editSettingsJson" class="admin-form-control"
                style="display: none; min-height: 300px;"></textarea>

            <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                <button type="button" class="btn" id="cancelSettingsBtn">Abbrechen</button>
                <button type="button" class="btn btn-primary" id="saveSettingsBtn"><i
                        class="fa-solid fa-floppy-disk"></i> Speichern</button>
            </div>
        </div>
    </div>
</dialog>

<!-- 5. LIGHTBOX EDITOR DIALOG -->
<dialog id="lightboxEditorDialog" style="max-width: 800px; width: 95%;">
    <div class="dialog-container">
        <div class="dialog-header-bar">
            <div class="dialog-header-title" id="lightboxEditorTitle">Bearbeiten</div>
            <button class="close-btn" id="closeLightboxEditorBtn">&times;</button>
        </div>
        <div class="dialog-body">
            <form id="lightboxEditorForm" onsubmit="return false;">
                <input type="hidden" id="lightboxEditTileId">
                <input type="hidden" id="lightboxEditFileName">
                <div class="admin-form-group" style="position: relative;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label>HTML-Code</label>
                        <button type="button" class="btn-magic-wand" id="lightboxLLMHelperBtn" title="KI-HTML-Assistent"
                            style="padding: 2px 8px; font-size: 0.8rem; background: var(--accent); color: #0b0f19; border: none; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 4px;"><i
                                class="fa-solid fa-wand-magic-sparkles"></i> KI-Assistent</button>
                    </div>
                    <div id="monacoLightboxEditor"
                        style="height: 380px; border: 1px solid var(--card-border); border-radius: 8px; overflow: hidden; margin-top: 0.5rem;">
                    </div>
                    <textarea id="editLightboxHtmlContent" class="admin-form-control"
                        style="display: none; min-height: 280px;" placeholder="HTML-Dokument..."></textarea>
                </div>
                <div class="mt-4" style="display:flex; gap:1rem; justify-content: flex-end;">
                    <button type="button" class="btn" id="cancelLightboxEditorBtn">Abbrechen</button>
                    <button type="submit" class="btn btn-primary" id="saveLightboxEditorBtn"><i
                            class="fa-solid fa-floppy-disk"></i> Speichern</button>
                </div>
            </form>
        </div>
    </div>
</dialog>

<!-- 6. LLM PROMPT DIALOG -->
<dialog id="llmPromptDialog" style="max-width: 500px; width: 90%;">
    <div class="dialog-container">
        <div class="dialog-header-bar">
            <div class="dialog-header-title">KI-Assistent</div>
            <button class="close-btn" id="closeLlmPromptBtn">&times;</button>
        </div>
        <div class="dialog-body">
            <div class="admin-form-group">
                <label for="llmPromptInput">Anweisung:</label>
                <textarea id="llmPromptInput" class="admin-form-control" style="min-height: 100px;"
                    placeholder="z.B. Übersetze in Englisch..."></textarea>
            </div>

            <div class="macro-list" style="margin-top: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem;">
                <span class="macro-title"
                    style="font-size: 0.8rem; color: var(--text-secondary); font-weight: 600;">Makro-Vorlagen:</span>
                <button type="button" class="btn-macro"
                    data-macro="Without changing the structure, translate the following document into %, respond ONLY with the translated document:">Übersetzen
                    in...</button>
                <button type="button" class="btn-macro"
                    data-macro="Improve the spelling and grammar of the following HTML document, respond ONLY with the corrected HTML:">Rechtschreibung
                    & Grammatik korrigieren</button>
                <button type="button" class="btn-macro"
                    data-macro="Format the following HTML document to be clean, indented, and professional. Respond ONLY with the formatted HTML:">HTML-Code
                    formatieren</button>
            </div>

            <div class="mt-4" style="display:flex; gap:1rem; justify-content: flex-end;">
                <button type="button" class="btn" id="cancelLlmPromptBtn">Abbrechen</button>
                <button type="button" class="btn btn-primary" id="confirmLlmPromptBtn"><i
                        class="fa-solid fa-wand-magic-sparkles"></i> Ausführen</button>
            </div>
        </div>
    </div>
</dialog>

<!-- 7. IMAGE PICKER DIALOG -->
<dialog id="imagePickerDialog" style="max-width: 800px; width: 95%;">
    <div class="dialog-container">
        <div class="dialog-header-bar">
            <div class="dialog-header-title">Hintergrundbild auswählen / verwalten</div>
            <button class="close-btn" id="closeImagePickerBtn">&times;</button>
        </div>
        <div class="dialog-body">
            <input type="file" id="imageUploadInput" accept="image/*" style="display: none;">

            <div class="image-picker-grid" id="imagePickerGrid">
                <!-- Dynamically loaded -->
            </div>

            <div class="mt-4" style="display:flex; gap:1rem; justify-content: flex-end;">
                <button type="button" class="btn" id="cancelImagePickerBtn">Schließen</button>
            </div>
        </div>
    </div>
</dialog>
