server:
  port: 8088
  host: "0.0.0.0"
  socket: "" # Optional Unix socket path (e.g. "/var/run/leben.sock")
  web_dir: "./frontend"
  public_url: "" # Optional externally visible base URL (e.g. "https://leben.8bj.de") used for device-flow verification links; derived from request headers when empty

database:
  host: "127.0.0.1"
  port: 5433
  dbname: "leben"
  user: "postgres"
  password: "postgrespassword"
  sslmode: "disable"

embedding:
  url: "http://localhost:11434"
  model: "nomic-embed-text-v2-moe:latest"
  query_prefix: "search_query: "
  doc_prefix: "search_document: "

llm:
  url: "http://localhost:3001"
  model: "auto"
  user: ""
  pass: ""

deepl:
  api_key: ""
  url: "https://api-free.deepl.com/v2/translate"

admin:
  # Default password hash for 'admin123'
  password_hash: "$2y$10$.8UcGLDKeZDoCLVZjNSac.7vwrMVwj1QLZLhQOLDSH5Ywo14QRhp2"
  # Browser login sessions expire after this many hours (default 12)
  session_ttl_hours: 12
  # Tools (MCP server, scripts) authenticate via device-flow API tokens
  # (POST /api/auth/device, approve at /device.html) — revocable in the admin
  # UI ("Sitzungen") or via DELETE /api/admin/tokens/:id.
